stages: [quality, test, security, release, build, scan, pages]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# ---- DRY anchors -------------------------------------------------------------
.backend_setup: &backend_setup
  image: python:3.12
  before_script:
    - cd backend
    - python -m venv .venv
    - .venv/bin/pip install --upgrade pip -q
    - .venv/bin/pip install -e ".[dev]" -q

.node_setup: &node_setup
  image: node:20

.on_push_or_mr: &on_push_or_mr
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ---- quality -----------------------------------------------------------------
commitlint:
  stage: quality
  image: node:22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - npm ci --no-audit --no-fund
    # Enforce Conventional Commits on MR commits so semantic-release can derive
    # versions + changelog. Config in commitlint.config.js.
    - npx commitlint --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to HEAD --verbose

ruff:
  stage: quality
  <<: *backend_setup
  <<: *on_push_or_mr
  script: [.venv/bin/python -m ruff check app tests]

mypy:
  stage: quality
  <<: *backend_setup
  <<: *on_push_or_mr
  allow_failure: true            # non-blocking baseline
  script: [.venv/bin/python -m mypy]

frontend-build:
  stage: quality
  <<: *node_setup
  <<: *on_push_or_mr
  script:
    - cd frontend
    - npm ci
    - npm run build

# ---- test --------------------------------------------------------------------
pytest:
  stage: test
  <<: *backend_setup
  <<: *on_push_or_mr
  script: [.venv/bin/python -m pytest -q]

offsite-manifests:
  # deploy/k8s/offsite-export (issue #13): kustomize build + kubeconform, pinned tools.
  stage: test
  image: python:3.12
  <<: *on_push_or_mr
  script:
    - |
      set -eu
      GH=https://github.com
      curl -sSfLO "$GH/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz"
      curl -sSfLO "$GH/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz"
      printf '%s  %s\n' \
        cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61 kustomize_v5.8.3_linux_amd64.tar.gz \
        9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883 kubeconform-linux-amd64.tar.gz \
        | sha256sum -c -
      for f in *.tar.gz; do tar xzf "$f" -C /usr/local/bin; done
      kustomize build deploy/k8s/offsite-export > offsite.yaml
      kubeconform -strict -ignore-missing-schemas -summary offsite.yaml

offsite-integration:
  # Real kopia against MinIO with Object Lock (backend/tests/integration, OFFSITE_IT=1).
  stage: test
  <<: *backend_setup
  <<: *on_push_or_mr
  variables:
    OFFSITE_IT: "1"
  script:
    - |
      set -eu
      T="$CI_PROJECT_DIR/.offsite-bin"; mkdir -p "$T"
      GH=https://github.com
      curl -sSfL -o "$T/kopia.tar.gz" "$GH/kopia/kopia/releases/download/v0.23.1/kopia-0.23.1-linux-x64.tar.gz"
      curl -sSfL -o "$T/minio" "$GH/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z"
      curl -sSfL -o "$T/mc" "$GH/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z"
      printf '%s  %s\n' \
        416d0f84a3dbb321a8b2d8f0997b1a0a6e915babe79ee76fa6e4d2bd1e1c5178 "$T/kopia.tar.gz" \
        7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f "$T/minio" \
        01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891 "$T/mc" \
        | sha256sum -c -
      tar xzf "$T/kopia.tar.gz" -C "$T" --strip-components=1 kopia-0.23.1-linux-x64/kopia
      chmod +x "$T/kopia" "$T/minio" "$T/mc"
      PATH="$T:$PATH" .venv/bin/python -m pytest -q tests/integration

plugin-test:
  stage: test
  image: golang:1.22
  <<: *on_push_or_mr
  script:
    - cd traefik/plugins-local/src/github.com/styx-portal/styxlocation
    - go test ./...

vitest:
  stage: test
  <<: *node_setup
  <<: *on_push_or_mr
  script:
    - cd frontend
    - npm ci
    - npm test

# ---- security ----------------------------------------------------------------
bandit:
  stage: security
  <<: *backend_setup
  <<: *on_push_or_mr
  script: [.venv/bin/python -m bandit -c pyproject.toml -r app -ll -ii]

trivy-fs:
  stage: security
  image:
    name: aquasec/trivy:0.58.0
    entrypoint: [""]
  <<: *on_push_or_mr
  script:
    - trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed .

# ---- release (semantic-release on default branch) ----------------------------
semantic-release:
  stage: release
  image: node:22   # semantic-release 25 requires Node >=22.14
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - npm ci --no-audit --no-fund
    # Needs GITLAB_TOKEN (Project Access Token, api scope) to create the tag/release.
    # The tag push then triggers the build/scan jobs. Without the token this no-ops
    # (|| true) and the pipeline stays green — just no GitLab release/images.
    - npx semantic-release || true

# ---- build (one job per image; matrix over IMAGE) ----------------------------
.build_template: &build_template
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    # Build/scan images ONLY on release tags. semantic-release creates a v* tag,
    # which spawns a tag pipeline ($CI_COMMIT_TAG set). Branch pipelines never
    # build — prevents empty-version tags when no release was cut (e.g. no token).
    - if: '$CI_COMMIT_TAG =~ /^v/'
      variables: { VERSION: "$CI_COMMIT_TAG" }
  before_script:
    - 'V="${VERSION#v}"; echo "Building $IMAGE:$V"'
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - V="${VERSION#v}"
    - docker build -t "$CI_REGISTRY_IMAGE/$IMAGE:$V" -t "$CI_REGISTRY_IMAGE/$IMAGE:latest" -f "${DOCKERFILE:-$CONTEXT/Dockerfile}" "$CONTEXT"
    - docker push "$CI_REGISTRY_IMAGE/$IMAGE:$V"
    - docker push "$CI_REGISTRY_IMAGE/$IMAGE:latest"

build-backend:
  <<: *build_template
  variables: { IMAGE: backend, CONTEXT: ., DOCKERFILE: backend/Dockerfile }
  before_script:
    - 'V="${VERSION#v}"; echo "Building $IMAGE:$V"'
    - sh scripts/stamp-version.sh "$V"   # bake released version into pyproject before build
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build-frontend:
  <<: *build_template
  variables: { IMAGE: frontend, CONTEXT: frontend }

build-desktop:
  <<: *build_template
  variables: { IMAGE: desktop, CONTEXT: images/desktop }
  # Desktop image ~4.5GB — shared runners may hit disk/time limits.
  # Document self-hosted runner tag here when available, e.g.:  tags: [big-disk]
  allow_failure: true

# ---- scan (Trivy image scan after build) -------------------------------------
.scan_template: &scan_template
  stage: scan
  image:
    name: aquasec/trivy:0.58.0
    entrypoint: [""]
  rules:
    # Build/scan images ONLY on release tags. semantic-release creates a v* tag,
    # which spawns a tag pipeline ($CI_COMMIT_TAG set). Branch pipelines never
    # build — prevents empty-version tags when no release was cut (e.g. no token).
    - if: '$CI_COMMIT_TAG =~ /^v/'
      variables: { VERSION: "$CI_COMMIT_TAG" }
  script:
    - V="${VERSION#v}"
    # PKG_TYPES defaults to os,library (backend/frontend: their app deps are ours).
    # Desktop overrides to os only — its library findings are vendored inside the
    # browsers/IDEs (bundled JARs, node_modules) and aren't fixable from our image.
    # SCANNERS defaults to vuln,secret. Desktop overrides to vuln only — its only
    # "secret" finding is Ubuntu's standard snakeoil placeholder key, a false positive.
    - trivy image --scanners "${SCANNERS:-vuln,secret}" --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --pkg-types "${PKG_TYPES:-os,library}" "$CI_REGISTRY_IMAGE/$IMAGE:$V"

scan-backend:  { <<: *scan_template, needs: [build-backend],  variables: { IMAGE: backend } }
scan-frontend: { <<: *scan_template, needs: [build-frontend], variables: { IMAGE: frontend } }
scan-desktop:  { <<: *scan_template, needs: [build-desktop],  variables: { IMAGE: desktop, PKG_TYPES: os, SCANNERS: vuln }, allow_failure: true }

# ---- pages (Zensical → GitLab Pages) -----------------------------------------
pages:
  stage: pages
  image: python:3.12
  script:
    # Shared with .github/workflows/docs.yml: pinned zensical + prunes internal specs/plans.
    - sh scripts/build-docs.sh
  pages:
    publish: site
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
