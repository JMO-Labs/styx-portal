stages: [quality, test, security, release, build, scan, pages]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# ---- DRY anchors -------------------------------------------------------------
.backend_setup: &backend_setup
  image: python:3.12
  before_script:
    - cd backend
    - python -m venv .venv
    - .venv/bin/pip install --upgrade pip -q
    - .venv/bin/pip install -e ".[dev]" -q

.node_setup: &node_setup
  image: node:20

.on_push_or_mr: &on_push_or_mr
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ---- quality -----------------------------------------------------------------
commitlint:
  stage: quality
  image: node:22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - npm ci --no-audit --no-fund
    # Enforce Conventional Commits on MR commits so semantic-release can derive
    # versions + changelog. Config in commitlint.config.js.
    - npx commitlint --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to HEAD --verbose

ruff:
  stage: quality
  <<: *backend_setup
  <<: *on_push_or_mr
  script: [.venv/bin/python -m ruff check app tests]

mypy:
  stage: quality
  <<: *backend_setup
  <<: *on_push_or_mr
  allow_failure: true            # non-blocking baseline
  script: [.venv/bin/python -m mypy]

frontend-build:
  stage: quality
  <<: *node_setup
  <<: *on_push_or_mr
  script:
    - cd frontend
    - npm ci
    - npm run build

# ---- test --------------------------------------------------------------------
pytest:
  stage: test
  <<: *backend_setup
  <<: *on_push_or_mr
  script: [.venv/bin/python -m pytest -q]

openbao-iac:
  # deploy/enterprise/{openbao,external-secrets} (issue #4): render vendored charts and
  # kustomizations, kubeconform, lint the playbook and the TLS script. Pinned, sha256-checked.
  stage: test
  image: python:3.12
  <<: *on_push_or_mr
  script:
    - |
      set -eu
      pip install -q ansible-core==2.21.6 ansible-lint==26.11.0 yamllint==1.38.0 shellcheck-py==0.11.0.1
      T="$CI_PROJECT_DIR/.k8stools"; mkdir -p "$T"; cd "$T"
      GH=https://github.com
      curl -sSfLO https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
      curl -sSfLO "$GH/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz"
      curl -sSfLO "$GH/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz"
      printf '%s  %s\n' \
        0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b helm-v4.3.1-linux-amd64.tar.gz \
        cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61 kustomize_v5.8.3_linux_amd64.tar.gz \
        9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883 kubeconform-linux-amd64.tar.gz \
        | sha256sum -c -
      tar xzf helm-v4.3.1-linux-amd64.tar.gz --strip-components=1 linux-amd64/helm
      tar xzf kustomize_v5.8.3_linux_amd64.tar.gz
      tar xzf kubeconform-linux-amd64.tar.gz kubeconform
      export PATH="$T:$PATH"
      cd "$CI_PROJECT_DIR/deploy/enterprise"
      helm template openbao openbao/charts/openbao-0.30.7.tgz --skip-tests -n openbao \
        -f openbao/values.yaml > "$T/openbao-chart.yaml"
      # Only the server StatefulSet may mount the seal-key hostPath (the chart test pod copies it).
      test "$(grep -c "path: /etc/openbao/seal" "$T/openbao-chart.yaml")" = 1
      helm template external-secrets external-secrets/charts/external-secrets-2.14.0.tgz \
        -n external-secrets -f external-secrets/values.yaml > "$T/eso-chart.yaml"
      kustomize build openbao > "$T/openbao.yaml"
      kustomize build external-secrets > "$T/eso.yaml"
      kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.36.6 -summary "$T"/*.yaml
      yamllint -c .yamllint openbao external-secrets
      shellcheck openbao/gen-bootstrap-tls.sh
      cd openbao
      ansible-lint ansible/seal-key.yml
      ansible-playbook -i ansible/inventory.example.yml ansible/seal-key.yml --syntax-check

openbao-integration:
  # Real OpenBao 2.7.2 static seal: restart, wrong key, rotation, snapshot restore, deployed HCL.
  # Uses the sha256-pinned release binary (same build as the pinned image), so no Docker.
  stage: test
  <<: *backend_setup
  <<: *on_push_or_mr
  variables:
    OPENBAO_IT: "1"
  script:
    - |
      set -eu
      T="$CI_PROJECT_DIR/.openbao-bin"; mkdir -p "$T"
      curl -sSfL -o "$T/bao.tar.gz" https://github.com/openbao/openbao/releases/download/v2.7.2/openbao_2.7.2_linux_amd64.tar.gz
      echo "582b1f3c2fdc5afd443b2d57a225ef654de75adea609fdb66731fd582a9cbc96  $T/bao.tar.gz" | sha256sum -c -
      tar xzf "$T/bao.tar.gz" -C "$T" bao
      PATH="$T:$PATH" .venv/bin/python -m pytest -q tests/integration/test_openbao_static_seal.py

harbor-iac:
  # deploy/enterprise/harbor (issue #5): helm template (vendored chart 1.19.4) + kustomize
  # + kubeconform, pinned tools. CRDs validate against the datreeio CRDs-catalog.
  stage: test
  image: python:3.12
  <<: *on_push_or_mr
  script:
    - |
      set -eu
      GH=https://github.com
      curl -sSfLO https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz
      curl -sSfLO "$GH/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz"
      curl -sSfLO "$GH/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz"
      printf '%s  %s\n' \
        896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea helm-v3.22.1-linux-amd64.tar.gz \
        cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61 kustomize_v5.8.3_linux_amd64.tar.gz \
        9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883 kubeconform-linux-amd64.tar.gz \
        | sha256sum -c -
      tar xzf helm-v3.22.1-linux-amd64.tar.gz -C /usr/local/bin --strip-components=1 linux-amd64/helm
      for f in kustomize_*.tar.gz kubeconform-*.tar.gz; do tar xzf "$f" -C /usr/local/bin; done
      H=deploy/enterprise/harbor
      helm template harbor "$H/charts/harbor-1.19.4.tgz" -n harbor -f "$H/values.yaml" > harbor-chart.yaml
      kustomize build "$H" > harbor-extra.yaml
      kubeconform -strict -ignore-missing-schemas -summary -kubernetes-version 1.36.6 \
        -schema-location default \
        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
        harbor-chart.yaml harbor-extra.yaml

plugin-test:
  stage: test
  image: golang:1.22
  <<: *on_push_or_mr
  script:
    - cd traefik/plugins-local/src/github.com/styx-portal/styxlocation
    - go test ./...

vitest:
  stage: test
  <<: *node_setup
  <<: *on_push_or_mr
  script:
    - cd frontend
    - npm ci
    - npm test

# ---- security ----------------------------------------------------------------
bandit:
  stage: security
  <<: *backend_setup
  <<: *on_push_or_mr
  script: [.venv/bin/python -m bandit -c pyproject.toml -r app -ll -ii]

trivy-fs:
  stage: security
  image:
    name: aquasec/trivy:0.58.0
    entrypoint: [""]
  <<: *on_push_or_mr
  script:
    - trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed .

# ---- release (semantic-release on default branch) ----------------------------
semantic-release:
  stage: release
  image: node:22   # semantic-release 25 requires Node >=22.14
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - npm ci --no-audit --no-fund
    # Needs GITLAB_TOKEN (Project Access Token, api scope) to create the tag/release.
    # The tag push then triggers the build/scan jobs. Without the token this no-ops
    # (|| true) and the pipeline stays green — just no GitLab release/images.
    - npx semantic-release || true

# ---- build (one job per image; matrix over IMAGE) ----------------------------
.build_template: &build_template
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    # Build/scan images ONLY on release tags. semantic-release creates a v* tag,
    # which spawns a tag pipeline ($CI_COMMIT_TAG set). Branch pipelines never
    # build — prevents empty-version tags when no release was cut (e.g. no token).
    - if: '$CI_COMMIT_TAG =~ /^v/'
      variables: { VERSION: "$CI_COMMIT_TAG" }
  before_script:
    - 'V="${VERSION#v}"; echo "Building $IMAGE:$V"'
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - V="${VERSION#v}"
    - docker build -t "$CI_REGISTRY_IMAGE/$IMAGE:$V" -t "$CI_REGISTRY_IMAGE/$IMAGE:latest" -f "${DOCKERFILE:-$CONTEXT/Dockerfile}" "$CONTEXT"
    - docker push "$CI_REGISTRY_IMAGE/$IMAGE:$V"
    - docker push "$CI_REGISTRY_IMAGE/$IMAGE:latest"

build-backend:
  <<: *build_template
  variables: { IMAGE: backend, CONTEXT: ., DOCKERFILE: backend/Dockerfile }
  before_script:
    - 'V="${VERSION#v}"; echo "Building $IMAGE:$V"'
    - sh scripts/stamp-version.sh "$V"   # bake released version into pyproject before build
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build-frontend:
  <<: *build_template
  variables: { IMAGE: frontend, CONTEXT: frontend }

build-desktop:
  <<: *build_template
  variables: { IMAGE: desktop, CONTEXT: images/desktop }
  # Desktop image ~4.5GB — shared runners may hit disk/time limits.
  # Document self-hosted runner tag here when available, e.g.:  tags: [big-disk]
  allow_failure: true

# ---- scan (Trivy image scan after build) -------------------------------------
.scan_template: &scan_template
  stage: scan
  image:
    name: aquasec/trivy:0.58.0
    entrypoint: [""]
  rules:
    # Build/scan images ONLY on release tags. semantic-release creates a v* tag,
    # which spawns a tag pipeline ($CI_COMMIT_TAG set). Branch pipelines never
    # build — prevents empty-version tags when no release was cut (e.g. no token).
    - if: '$CI_COMMIT_TAG =~ /^v/'
      variables: { VERSION: "$CI_COMMIT_TAG" }
  script:
    - V="${VERSION#v}"
    # PKG_TYPES defaults to os,library (backend/frontend: their app deps are ours).
    # Desktop overrides to os only — its library findings are vendored inside the
    # browsers/IDEs (bundled JARs, node_modules) and aren't fixable from our image.
    # SCANNERS defaults to vuln,secret. Desktop overrides to vuln only — its only
    # "secret" finding is Ubuntu's standard snakeoil placeholder key, a false positive.
    - trivy image --scanners "${SCANNERS:-vuln,secret}" --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --pkg-types "${PKG_TYPES:-os,library}" "$CI_REGISTRY_IMAGE/$IMAGE:$V"

scan-backend:  { <<: *scan_template, needs: [build-backend],  variables: { IMAGE: backend } }
scan-frontend: { <<: *scan_template, needs: [build-frontend], variables: { IMAGE: frontend } }
scan-desktop:  { <<: *scan_template, needs: [build-desktop],  variables: { IMAGE: desktop, PKG_TYPES: os, SCANNERS: vuln }, allow_failure: true }

# ---- pages (Zensical → GitLab Pages) -----------------------------------------
pages:
  stage: pages
  image: python:3.12
  script:
    # Shared with .github/workflows/docs.yml: pinned zensical + prunes internal specs/plans.
    - sh scripts/build-docs.sh
  pages:
    publish: site
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
