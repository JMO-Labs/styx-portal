apiVersion: v1
kind: Namespace
metadata:
  name: enterprise-base
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Pod
metadata:
  name: enterprise-base
  namespace: enterprise-base
  labels:
    app: enterprise-base
spec:
  containers:
    - name: selkies
      image: styx-enterprise-base:kind
      imagePullPolicy: Never
      ports:
        - containerPort: 8080
      env:
        - {name: STYX_UNLOCK_KEY, value: kind-spike-key}
        - {name: STYX_INSTANCE_ID, value: kind}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      readinessProbe:
        tcpSocket:
          port: 8080
        periodSeconds: 5
        failureThreshold: 36
