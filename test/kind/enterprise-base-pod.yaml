apiVersion: v1
kind: Namespace
metadata:
  name: enterprise-base
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Pod
metadata:
  name: enterprise-base
  namespace: enterprise-base
  labels:
    app: enterprise-base
spec:
  containers:
    - name: selkies
      image: styx-enterprise-base:kind
      imagePullPolicy: Never
      ports:
        - containerPort: 8082
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      readinessProbe:
        httpGet:
          path: /
          port: 8082
        periodSeconds: 5
        failureThreshold: 36
