---
# Pinned from the RKE2 stable channel on 2026-11-10.
rke2_version: v1.36.6+rke2r1
rke2_allow_downgrade: false
# Air-gap: Phase 1 images come from the seed bundle (deploy/enterprise/images/phase1.lock),
# dropped into agent/images/ by site.yml when seed_bundle_src is set (README "Air-gap").
rke2_airgap_mode: true
# Path on the Ansible controller of out/phase1-seed.tar (scripts/build_seed_bundle.sh).
seed_bundle_src: ""


# Never commit the token: env var (CI masked variable) or override in Vault.
rke2_token: "{{ lookup('env', 'RKE2_TOKEN') }}"

rke2_cis_profile: cis
rke2_kube_apiserver_args:
  - service-account-extend-token-expiration=false

# HA API: keepalived VIP (kube-vip IPVS conflicts with Cilium kube-proxy replacement, #18).
rke2_ha_mode: true
rke2_ha_mode_keepalived: true
rke2_ha_mode_kubevip: false
rke2_api_ip: 192.0.2.10
rke2_additional_sans:
  - 192.0.2.10
  - rke2-api.example.internal

rke2_cni: [cilium]
# Cilium values: templates/rke2-cilium.yaml (README "Cilium").
cilium_kube_proxy_replacement: true
cilium_encryption_type: wireguard  # wireguard | ipsec | none
# Tied to KPR so the two cannot drift: kube-proxy off only when Cilium replaces it.
disable_kube_proxy: "{{ cilium_kube_proxy_replacement }}"
rke2_ingress_controller: none
