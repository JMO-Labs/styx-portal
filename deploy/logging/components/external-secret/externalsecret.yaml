apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elastic-shipper
  namespace: logging
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: elastic-shipper
  data:
    - secretKey: ELASTIC_API_KEY
      remoteRef: {key: kv/styx/logging/elastic, property: api_key}
