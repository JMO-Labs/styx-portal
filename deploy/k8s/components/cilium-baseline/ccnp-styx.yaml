# Styx (backend + frontend): ingress from Traefik, egress to DNS, kube-apiserver,
# CNPG and Keycloak. Intra-namespace traffic is covered by allow-intra-ns-styx.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: styx
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: styx
    matchExpressions:
      - {key: k8s:io.kubernetes.pod.namespace, operator: NotIn, values: [kube-system]}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - {port: "8000", protocol: TCP}
            - {port: "3000", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: ANY}
    - toEntities: [kube-apiserver]
    # PLACEHOLDER(#4): CNPG cluster pods and namespace. Points at pods in the styx
    # namespace for now; the AC lists cnpg-system, switch when #4 settles the layout.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: styx
            cnpg.io/podRole: instance
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
    # PLACEHOLDER(#5): Keycloak namespace, labels and port
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: keycloak
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
            - {port: "8443", protocol: TCP}
