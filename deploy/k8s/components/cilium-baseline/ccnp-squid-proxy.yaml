# Squid proxy policy: only desktops may reach it; it may reach the internet on
# 80/443 and DNS. PROXY_* placeholders are filled from proxy-params.yaml.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: squid-proxy
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: PROXY_NAMESPACE
      app.kubernetes.io/name: PROXY_NAME
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: styx-instances
      toPorts:
        - ports:
            - {port: PROXY_PORT, protocol: TCP}
  egress:
    - toEntities: [world]
      toPorts:
        - ports:
            - {port: "80", protocol: TCP}
            - {port: "443", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: ANY}
          rules:
            dns:
              - matchPattern: "*"
