# JSON6902 patch for CiliumNetworkPolicy styx-instances/instances. Cilium
# allows are a union, so egress is REPLACED (not extended): desktops reach only
# cluster-local DNS and the proxy. egressDeny and ingress stay as in the base.
# PROXY_* placeholders are filled from proxy-params.yaml.
# Option B (off-cluster proxy) would swap the 2nd rule for a /32 toCIDR.
- op: replace
  path: /spec/egress
  value:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: ANY}
          rules:
            dns:
              - matchPattern: "*.cluster.local"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: PROXY_NAMESPACE
            app.kubernetes.io/name: PROXY_NAME
      toPorts:
        - ports:
            - {port: PROXY_PORT, protocol: TCP}
