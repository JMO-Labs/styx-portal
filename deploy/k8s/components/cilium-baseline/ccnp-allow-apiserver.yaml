# Egress to the kube-apiserver. With KPR the 10.43.0.1:443 VIP is translated to
# the node's :6443 before policy, so match 6443 via the entity (not a CIDR).
# Instance pods and the Squid desktop-egress proxy (ADR-0040, D40) must not
# reach the apiserver. PROXY_NAMESPACE is filled from proxy-params.yaml by
# kustomization.yaml `replacements`. Traefik is NOT excluded:
# its Kubernetes providers watch the apiserver for routes.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-apiserver
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values: [kube-system]
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values: [styx-instances, PROXY_NAMESPACE]
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
