# Egress to the kube-apiserver. With KPR the 10.43.0.1:443 VIP is translated to
# the node's :6443 before policy, so match 6443 via the entity (not a CIDR).
# Instance pods and the proxy namespace must not reach the apiserver.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-apiserver
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values: [kube-system]
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values: [styx-instances, traefik]
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
