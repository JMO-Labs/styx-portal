# Own namespace: the jobs need CAP_DAC_READ_SEARCH (see cronjob-export.yaml), which PSS
# baseline (the styx namespace) rejects. Only these two CronJobs run here.
apiVersion: v1
kind: Namespace
metadata:
  name: styx-backup
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
