# Key source (D42): OpenBao KV via External Secrets. The jobs read only the Secret
# styx-offsite-export, so swapping the key source means replacing this file only.
# Offline escrow of KOPIA_PASSWORD: docs/operate/offsite-backup.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: styx-offsite-export
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: styx-offsite-export
    creationPolicy: Owner
  data:
    - secretKey: KOPIA_PASSWORD
      remoteRef: {key: backup/offsite/kopia, property: KOPIA_PASSWORD}
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: backup/offsite/kopia, property: AWS_ACCESS_KEY_ID}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: backup/offsite/kopia, property: AWS_SECRET_ACCESS_KEY}
