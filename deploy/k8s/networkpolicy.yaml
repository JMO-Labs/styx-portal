apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: styx
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
  namespace: styx
spec:
  podSelector:
    matchLabels: {app: styx-backend}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
        - podSelector:
            matchLabels: {app: styx-frontend}
      ports: [{port: 8000, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-ingress
  namespace: styx
spec:
  podSelector:
    matchLabels: {app: styx-frontend}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
      ports: [{port: 3000, protocol: TCP}]
---
# Metrics port is separate from the API port: only the monitoring namespace
# (Prometheus) may reach it. backend-ingress deliberately does not allow 9000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-metrics-ingress
  namespace: styx
spec:
  podSelector:
    matchLabels: {app: styx-backend}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{port: 9000, protocol: TCP}]
