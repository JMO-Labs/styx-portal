# The one OpenBao store (issue #4, ADR-0042). #13 (backup/offsite/kopia) and the OpenBao
# snapshot job reference it by name. Accepted risk: any namespace with the label below can
# read all of kv/; only platform admins may set that label (docs/enterprise/runbooks/openbao.md).
# Needs Secret external-secrets/openbao-ca (ca.crt) from gen-bootstrap-tls.sh.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          styx.io/openbao-secrets: "true"
  provider:
    vault:
      server: https://openbao-active.openbao.svc:8200
      path: kv
      version: v2
      caProvider:
        type: Secret
        name: openbao-ca
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
