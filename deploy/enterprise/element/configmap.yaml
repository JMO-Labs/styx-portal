apiVersion: v1
kind: ConfigMap
metadata:
  name: element-config
  namespace: matrix
  labels: {app.kubernetes.io/name: element}
data:
  config.json: |
    {
      "default_server_config": {
        "m.homeserver": {
          "base_url": "https://matrix.example.internal",
          "server_name": "example.internal"
        }
      },
      "disable_custom_urls": true,
      "disable_guests": true,
      "disable_login_language_selector": true,
      "sso_redirect_options": {"immediate": true},
      "brand": "Element"
    }
