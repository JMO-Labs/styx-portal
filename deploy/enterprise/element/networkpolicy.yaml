# Ingress only from the ingress controller (traefik); egress DNS only.
# Element is static: the browser talks to Synapse directly, the pod never does.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: element
  namespace: matrix
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: element}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
      ports: [{port: 8080, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
