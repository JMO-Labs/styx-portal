# Offsite BSL credentials (AWS shared-credentials file in key "cloud") from OpenBao KV kv/velero/bsl.
# Labelled so Velero never backs up its own credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-bsl-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: velero-bsl-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          velero.io/exclude-from-backup: "true"
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .aws_access_key_id }}
          aws_secret_access_key={{ .aws_secret_access_key }}
  data:
    - secretKey: aws_access_key_id
      remoteRef: {key: velero/bsl, property: aws_access_key_id}
    - secretKey: aws_secret_access_key
      remoteRef: {key: velero/bsl, property: aws_secret_access_key}
---
# Kopia repository password (client-side encryption), from OpenBao KV kv/velero/repo.
# MUST exist before the first backup: Velero initialises the repository with it, and losing it
# makes every existing backup unreadable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-repo-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: velero-repo-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          velero.io/exclude-from-backup: "true"
  data:
    - secretKey: repository-password
      remoteRef: {key: velero/repo, property: repository-password}
