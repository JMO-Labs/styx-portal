# Velero backup plain manifests (issue #36). The server itself comes from the vendored Helm chart:
# helm template velero charts/velero-12.2.4.tgz --skip-tests -n velero -f velero-values.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - velero-externalsecrets.yaml
  - networkpolicy.yaml
  - home-snapshots-client.yaml
  - home-snapshots-params.yaml
  - home-snapshots-cronjob.yaml
  - velero-schedules.yaml
  - prometheusrule.yaml
configMapGenerator:
  - name: styx-home-snapshots-script
    namespace: styx-backup
    files:
      - home-snapshots.sh
