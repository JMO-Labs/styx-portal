# Secrets sourced from OpenBao. ClusterSecretStore "openbao" is a placeholder
# until #4 delivers it. Remote key paths are defaults; adjust in the overlay.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: styx-secrets, namespace: styx}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: styx-secrets, creationPolicy: Owner}
  data:
    # JWT_SECRET MUST be set in OpenBao on enterprise.
    - secretKey: JWT_SECRET
      remoteRef: {key: styx/backend, property: JWT_SECRET}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: styx-db-bucket, namespace: styx}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: styx-db-bucket, creationPolicy: Owner}
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: styx/db-bucket, property: ACCESS_KEY_ID}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: styx/db-bucket, property: ACCESS_SECRET_KEY}
    - secretKey: SSE_C_KEY
      remoteRef: {key: styx/db-bucket, property: SSE_C_KEY}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: styx-matrix-notify, namespace: styx}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: styx-matrix-notify, creationPolicy: Owner}
  data:
    - secretKey: MATRIX_NOTIFY_HOMESERVER
      remoteRef: {key: styx/matrix/notify, property: MATRIX_NOTIFY_HOMESERVER}
    - secretKey: MATRIX_NOTIFY_ROOM_ID
      remoteRef: {key: styx/matrix/notify, property: MATRIX_NOTIFY_ROOM_ID}
    - secretKey: MATRIX_NOTIFY_TOKEN
      remoteRef: {key: styx/matrix/notify, property: MATRIX_NOTIFY_TOKEN}
