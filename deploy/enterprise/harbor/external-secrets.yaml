# Harbor secrets from OpenBao through ClusterSecretStore "openbao" (#4).
# Populate the kv/harbor/* paths before syncing (docs/operate/harbor-enterprise.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-admin
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: harbor-admin
  data:
    - secretKey: HARBOR_ADMIN_PASSWORD
      remoteRef: {key: kv/harbor/admin, property: password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-secret-key
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: harbor-secret-key
  data:
    - secretKey: secretKey              # must be exactly 16 characters
      remoteRef: {key: kv/harbor/secret-key, property: value}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-tls
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: harbor-tls
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .crt }}"
        tls.key: "{{ .key }}"
        ca.crt: "{{ .ca }}"
  data:
    - secretKey: crt
      remoteRef: {key: kv/harbor/tls, property: tls.crt}
    - secretKey: key
      remoteRef: {key: kv/harbor/tls, property: tls.key}
    - secretKey: ca
      remoteRef: {key: kv/harbor/tls, property: ca.crt}
---
# Secret of robot "ci-push", written to OpenBao by the operator after harbor_bootstrap.py.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-bootstrap-robot
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: harbor-bootstrap-robot
  data:
    - secretKey: name
      remoteRef: {key: kv/harbor/robot-ci, property: name}
    - secretKey: secret
      remoteRef: {key: kv/harbor/robot-ci, property: secret}
---
# Offsite bucket credentials for the harbor-db barman-cloud ObjectStore (#24 pattern).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-db-offsite
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: harbor-db-offsite
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: kv/harbor/db-offsite, property: access_key_id}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: kv/harbor/db-offsite, property: secret_access_key}
---
# Internal component secrets. Set in values.yaml so `helm template` never generates
# random ones (that would rotate keys and roll every pod on each apply).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-core-secret
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: harbor-core-secret
  data:
    - secretKey: secret                 # exactly 16 characters
      remoteRef: {key: kv/harbor/core, property: secret}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-core-token
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: harbor-core-token
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .crt }}"
        tls.key: "{{ .key }}"
  data:
    - secretKey: crt
      remoteRef: {key: kv/harbor/core-token, property: tls.crt}
    - secretKey: key
      remoteRef: {key: kv/harbor/core-token, property: tls.key}
---
