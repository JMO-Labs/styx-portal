# Maps the OBC Secret keys to the names Harbor's registry expects. ESO reads the
# Secret through a kubernetes-provider SecretStore limited to namespace harbor.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-s3-reader
  namespace: harbor
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harbor-s3-reader
  namespace: harbor
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [harbor-registry-bucket]   # the OBC Secret only
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-s3-reader
  namespace: harbor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harbor-s3-reader
subjects:
  - kind: ServiceAccount
    name: harbor-s3-reader
    namespace: harbor
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: harbor-local
  namespace: harbor
spec:
  provider:
    kubernetes:
      remoteNamespace: harbor
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: harbor-s3-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-s3
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: harbor-local
  target:
    name: harbor-s3
    template:
      data:
        REGISTRY_STORAGE_S3_ACCESSKEY: "{{ .access }}"
        REGISTRY_STORAGE_S3_SECRETKEY: "{{ .secret }}"
  data:
    - secretKey: access
      remoteRef:
        key: harbor-registry-bucket
        property: AWS_ACCESS_KEY_ID
    - secretKey: secret
      remoteRef:
        key: harbor-registry-bucket
        property: AWS_SECRET_ACCESS_KEY
