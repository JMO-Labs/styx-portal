# App-role credentials for the CNPG cluster. CNPG 1.30 has no native rotation,
# so ESO generates the password and Merges it into the CNPG-managed Secret
# styx-db-app; the cnpg.io/reload label makes CNPG apply it immediately.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: {name: styx-db-password, namespace: styx}
spec:
  length: 32
  digits: 6
  noUpper: false
  allowRepeat: true
  # Symbols break URLs and pgpass (: \ @ / # ?), so none are used.
  noSymbols: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: styx-db-app, namespace: styx}
spec:
  # Rotation interval (NIST IA-5): a new password is generated every 720h
  # (30 days). Change it in the overlay. It is an interval, not a cron.
  refreshInterval: 720h
  target:
    name: styx-db-app
    creationPolicy: Merge
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: styx
        password: "{{ .password }}"
        pgpass: "styx-db-rw:5432:styx:styx:{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: styx-db-password
