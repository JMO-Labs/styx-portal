# Break-glass admin credentials (ADR-0025) from OpenBao; never from the repo.
# Populate kv/keycloak/breakglass-{1,2} (username, password) before syncing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-breakglass
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: keycloak-breakglass
  data:
    - secretKey: BREAKGLASS_1_USERNAME
      remoteRef: {key: kv/keycloak/breakglass-1, property: username}
    - secretKey: BREAKGLASS_1_PASSWORD
      remoteRef: {key: kv/keycloak/breakglass-1, property: password}
    - secretKey: BREAKGLASS_2_USERNAME
      remoteRef: {key: kv/keycloak/breakglass-2, property: username}
    - secretKey: BREAKGLASS_2_PASSWORD
      remoteRef: {key: kv/keycloak/breakglass-2, property: password}
