# Keycloak secrets from OpenBao through ClusterSecretStore "openbao".
# Populate kv/keycloak/* before syncing. No plain Secret holds data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: keycloak-admin
  data:
    - secretKey: username
      remoteRef: {key: kv/keycloak/admin, property: username}
    - secretKey: password
      remoteRef: {key: kv/keycloak/admin, property: password}
---
# Credentials for the app user created by CNPG initdb (secret.name in keycloak-db.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-app
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: keycloak-db-app
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef: {key: kv/keycloak/db, property: username}
    - secretKey: password
      remoteRef: {key: kv/keycloak/db, property: password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-offsite
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: keycloak-db-offsite
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: kv/keycloak/db-offsite, property: access_key_id}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: kv/keycloak/db-offsite, property: secret_access_key}
