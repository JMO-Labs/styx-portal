# Keycloak base IaC (issue #128, ADR-0014). Realm config and CRL mirror are
# sibling tickets. breakglass/ holds the ExternalSecret, alert and bootstrap script.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - external-secrets.yaml
  - keycloak-db.yaml
  - deployment.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - breakglass/externalsecret.yaml
  - breakglass/prometheusrule.yaml
  - crl-mirror/pvc.yaml
  - crl-mirror/cronjob.yaml
  - crl-mirror/prometheusrule.yaml
configMapGenerator:
  - name: keycloak-realm
    files:
      - styx-realm.json=realm/styx-realm.json
  - name: keycloak-crl-mirror-script
    files:
      - crl_mirror.py=crl-mirror/crl_mirror.py
generatorOptions:
  disableNameSuffixHash: true
