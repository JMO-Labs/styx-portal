# Keycloak base IaC (issue #128, ADR-0014). Realm config, CRL mirror and break-glass
# users are sibling tickets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - external-secrets.yaml
  - keycloak-db.yaml
  - deployment.yaml
  - networkpolicy.yaml
  - pdb.yaml
configMapGenerator:
  - name: keycloak-realm
    files:
      - styx-realm.json=realm/styx-realm.json
generatorOptions:
  disableNameSuffixHash: true
