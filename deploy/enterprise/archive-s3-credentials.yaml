# Bridges the Rook CephObjectStoreUser Secret (ns rook-ceph) into ns styx as
# styx-archive-s3 (keys AccessKey/SecretKey) for the backend. ESO reads it via a
# kubernetes-provider SecretStore whose SA may only get that one Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: archive-s3-reader
  namespace: styx
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: styx-archive-s3-reader
  namespace: rook-ceph
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [rook-ceph-object-user-styx-store-styx-archive]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: styx-archive-s3-reader
  namespace: rook-ceph
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: styx-archive-s3-reader
subjects:
  - kind: ServiceAccount
    name: archive-s3-reader
    namespace: styx
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: rook-archive-user
  namespace: styx
spec:
  provider:
    kubernetes:
      remoteNamespace: rook-ceph
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: archive-s3-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: styx-archive-s3
  namespace: styx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: rook-archive-user
  target:
    name: styx-archive-s3
  data:
    - secretKey: AccessKey
      remoteRef:
        key: rook-ceph-object-user-styx-store-styx-archive
        property: AccessKey
    - secretKey: SecretKey
      remoteRef:
        key: rook-ceph-object-user-styx-store-styx-archive
        property: SecretKey
