apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: banner-ingress-from-traefik
  namespace: banner
spec:
  endpointSelector:
    matchLabels: {app: banner}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
