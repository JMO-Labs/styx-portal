apiVersion: v1
kind: ConfigMap
metadata:
  name: banner-site
  namespace: banner
data:
  # Site values: set the login start URL in the /start redirect below
  # (backend GET /api/auth/oauth/<name>/start, see backend/app/routers/oauth.py).
  nginx.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Cache-Control "no-store" always;
      location = /start {
        # PLACEHOLDER: Styx login start URL for the CAC OIDC provider
        return 302 https://login.example.internal/api/auth/oauth/keycloak/start;
      }
      location / { try_files $uri =404; }
    }
  styles.css: |
    :root { color-scheme: dark light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0b0f14; color: #e6edf3; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 42rem; margin: 1rem; padding: 2rem; background: #131a22;
      border: 1px solid #2a3644; border-radius: 12px; }
    h1 { font-size: 1.1rem; letter-spacing: .08em; text-transform: uppercase; color: #7cc4ff; }
    p { margin: 0 0 1rem; }
    .actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
    a.btn { padding: .7rem 1.4rem; border-radius: 8px; text-decoration: none;
      border: 1px solid #3a4a5c; color: #e6edf3; }
    a.btn:focus-visible { outline: 3px solid #7cc4ff; outline-offset: 2px; }
    a.primary { background: #2f81f7; border-color: #2f81f7; color: #fff; }
  index.html: |
    <!doctype html>
    <html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Styx - System Use Notification</title>
    <link rel="stylesheet" href="/styles.css"></head>
    <body><main>
    <h1>System Use Notification</h1>
    <p>You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.</p>
    <p>By using this IS (which includes any device attached to this IS), you consent to the following conditions:</p>
    <p>The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.</p>
    <p>At any time, the USG may inspect and seize data stored on this IS.</p>
    <p>Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.</p>
    <p>This IS includes security measures (e.g., authentication and access controls) to protect USG interests, not for your personal benefit or privacy.</p>
    <p>Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential.</p>
    <div class="actions">
    <a id="agree" class="btn primary" href="/start">I agree</a>
    <a id="decline" class="btn" href="/declined.html">Decline</a>
    </div></main></body></html>
  declined.html: |
    <!doctype html>
    <html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Styx - Access declined</title>
    <link rel="stylesheet" href="/styles.css"></head>
    <body><main>
    <h1>Access declined</h1>
    <p>You declined the system use notification. Access has been declined; close this window.</p>
    </main></body></html>
