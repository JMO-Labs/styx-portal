# S3 credentials for the snapshot upload, from OpenBao KV kv/openbao/snapshot-s3.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-snapshot-s3
  namespace: openbao
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: openbao-snapshot-s3
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: openbao/snapshot-s3, property: AWS_ACCESS_KEY_ID}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: openbao/snapshot-s3, property: AWS_SECRET_ACCESS_KEY}
