# Wiki.js secrets from OpenBao through ClusterSecretStore "openbao". No plain Secret holds data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wikijs-oidc
  namespace: wikijs
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: wikijs-oidc
  data:
    - secretKey: client-secret
      remoteRef: {key: kv/styx/wikijs/oidc, property: client_secret}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wikijs-db-app
  namespace: wikijs
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: wikijs-db-app
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef: {key: kv/wikijs/db, property: username}
    - secretKey: password
      remoteRef: {key: kv/wikijs/db, property: password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wikijs-db-offsite
  namespace: wikijs
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: wikijs-db-offsite
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: kv/wikijs/db-offsite, property: access_key_id}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: kv/wikijs/db-offsite, property: secret_access_key}
