# Dedicated CloudNativePG cluster for Wiki.js (same shape as keycloak/keycloak-db.yaml).
# CNPG creates its own PodDisruptionBudgets for wikijs-db.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wikijs-db
  namespace: wikijs
spec:
  instances: 2
  # ghcr.io/cloudnative-pg/postgresql:17.11-202611090810-standard-trixie, same digest.
  imageName: harbor.example.internal/cloudnative-pg/postgresql:17.11-202611090810-standard-trixie@sha256:b310491521ece4ec0f5a44008ac607352e96bff20883833d0acd833d80d26c5b
  bootstrap:
    initdb:
      database: wikijs
      owner: wikijs
      secret:
        name: wikijs-db-app
  storage:
    size: 5Gi
    storageClass: ceph-block            # PLACEHOLDER(#3)
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: wikijs-db-offsite
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: wikijs-db-offsite
  namespace: wikijs
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://styx-offsite/cnpg/wikijs-db   # PLACEHOLDER(#24): offsite bucket
    endpointURL: https://offsite.example.internal        # PLACEHOLDER(#24)
    s3Credentials:
      accessKeyId:
        name: wikijs-db-offsite
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: wikijs-db-offsite
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: wikijs-db-daily
  namespace: wikijs
spec:
  schedule: "0 0 2 * * *"               # daily 02:00 (six-field cron)
  backupOwnerReference: self
  cluster:
    name: wikijs-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
