apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k8s
  - db-credentials.yaml
  - external-secrets.yaml
  - cluster.yaml
  - objectstore.yaml
  - scheduledbackup.yaml
  - networkpolicy.yaml
patches:
  - path: delete-homelab.yaml
  - path: prometheusrule-patch.yaml
replicas:
  - name: backend
    count: 3
