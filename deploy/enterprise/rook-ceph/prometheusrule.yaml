apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rook-ceph-recovery
  namespace: rook-ceph
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: rook-ceph-recovery
      rules:
        - alert: CephPGsDegraded
          # Ops decides whether to force recovery (runbook: forcing recovery).
          expr: ceph_pg_degraded > 0
          for: 4h
          labels: {severity: warning}
          annotations:
            summary: Ceph PGs degraded for over 4h
            runbook: docs/enterprise/runbooks/rook-ceph.md#force-recovery
        - alert: CephThrottleJobFailing
          # Failed job, or no successful run for over 1h (schedule is every 15 min).
          expr: |
            kube_job_failed{namespace="rook-ceph",job_name=~"ceph-mclock-throttle.*",condition="true"} > 0
            or (time() - kube_cronjob_status_last_successful_time{namespace="rook-ceph",cronjob="ceph-mclock-throttle"}) > 3600
            or absent(kube_cronjob_status_last_successful_time{namespace="rook-ceph",cronjob="ceph-mclock-throttle"})
          for: 1h
          labels: {severity: warning}
          annotations:
            summary: Ceph mClock throttle CronJob failing or not running for over 1h
            runbook: docs/enterprise/runbooks/rook-ceph.md#force-recovery
