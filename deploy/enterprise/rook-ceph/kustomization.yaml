apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Every manifest in this directory except operator-values.yaml and
# nvme-inventory.yaml (non-manifests) must be listed here.
resources:
  - local-pvs.yaml
  - cephcluster.yaml
  - pools.yaml
  - storageclasses.yaml
  - throttle-cephclient.yaml
  - throttle-config.yaml
  - throttle-cronjob.yaml
  - prometheusrule.yaml
configMapGenerator:
  - name: ceph-throttle-script
    namespace: rook-ceph
    files:
      - throttle/mclock_throttle.py
