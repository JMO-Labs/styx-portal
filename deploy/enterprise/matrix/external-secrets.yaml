# Synapse secrets from OpenBao through ClusterSecretStore "openbao". No plain Secret holds data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-oidc
  namespace: matrix
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: synapse-oidc
  data:
    - secretKey: client-secret
      remoteRef: {key: styx/synapse/oidc, property: client-secret}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-secrets
  namespace: matrix
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: synapse-secrets
  data:
    - secretKey: macaroon
      remoteRef: {key: styx/synapse/secrets, property: macaroon}
    - secretKey: registration
      remoteRef: {key: styx/synapse/secrets, property: registration}
    - secretKey: signing.key
      remoteRef: {key: styx/synapse/secrets, property: signing_key}
---
# Credentials for the app user created by CNPG initdb; pgpass is rendered for psycopg2 passfile.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-db-app
  namespace: matrix
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: synapse-db-app
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        pgpass: "synapse-db-rw:5432:synapse:{{ .username }}:{{ .password }}"
  data:
    - secretKey: username
      remoteRef: {key: styx/synapse/db, property: username}
    - secretKey: password
      remoteRef: {key: styx/synapse/db, property: password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-db-offsite
  namespace: matrix
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: synapse-db-offsite
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: styx/synapse/db-offsite, property: access_key_id}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: styx/synapse/db-offsite, property: secret_access_key}
