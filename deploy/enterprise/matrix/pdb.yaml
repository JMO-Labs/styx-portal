# synapse-db uses the PDBs CNPG creates. Synapse is a single replica (no worker split),
# so maxUnavailable 1 keeps node drains possible. Placeholder: with one replica it
# never blocks anything; revisit once replicas > 1.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: synapse
  namespace: matrix
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: synapse}
