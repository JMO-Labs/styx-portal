# Matrix Synapse base IaC (parent #201). Keycloak OIDC only; Element web and the
# Keycloak "synapse" client are sibling tickets. Same layout as ../keycloak.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - external-secrets.yaml
  - synapse-db.yaml
  - deployment.yaml
  - networkpolicy.yaml
  - pdb.yaml
configMapGenerator:
  - name: synapse-homeserver
    files:
      - homeserver.yaml=config/homeserver.yaml
      - log.config=config/log.config
generatorOptions:
  disableNameSuffixHash: true
