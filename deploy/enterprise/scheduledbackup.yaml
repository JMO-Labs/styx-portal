apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: styx-db-offsite-daily
  namespace: styx
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: styx-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: styx-db-snapshot-daily
  namespace: styx
spec:
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  cluster:
    name: styx-db
  method: volumeSnapshot
