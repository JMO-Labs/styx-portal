name: smartcard
on:
  push:
    branches: [main, master, enterprise]
    paths: ['smartcard/**', 'scripts/build_card_helper.sh', 'scripts/tests/build_card_helper_test.sh', 'scripts/tests/card_helper_msi_test.sh', 'docs/enterprise/runbooks/smartcard-helper-signing.md', '.github/workflows/smartcard.yml']
  pull_request:
    paths: ['smartcard/**', 'scripts/build_card_helper.sh', 'scripts/tests/build_card_helper_test.sh', 'scripts/tests/card_helper_msi_test.sh', 'docs/enterprise/runbooks/smartcard-helper-signing.md', '.github/workflows/smartcard.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.12"
      - name: smartcard/test.sh (Linux tests + Windows build/vet)
        run: smartcard/test.sh -v

  build-helper:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.12"
      - name: build script self-test
        run: scripts/tests/build_card_helper_test.sh
      - name: MSI/WiX, runbook and no-signing-material checks
        run: scripts/tests/card_helper_msi_test.sh
      - name: reproducible build (twice, compares SHA-256)
        run: scripts/build_card_helper.sh
      - uses: actions/upload-artifact@v4
        with:
          name: styx-card-helper-windows-amd64
          path: |
            smartcard/dist/styx-card-helper.exe
            smartcard/dist/styx-card-helper.exe.sha256
          if-no-files-found: error
