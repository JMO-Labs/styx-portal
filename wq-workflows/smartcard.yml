name: smartcard
on:
  push:
    branches: [main, master]
    paths: ['smartcard/**', '.github/workflows/smartcard.yml']
  pull_request:
    paths: ['smartcard/**', '.github/workflows/smartcard.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: smartcard/test.sh (Linux tests + Windows build/vet)
        run: smartcard/test.sh -v
