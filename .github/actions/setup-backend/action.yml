name: Setup Backend
description: Checkout-agnostic Python setup + backend dev dependency install (from uv.lock)
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install backend dev deps
      shell: bash
      working-directory: backend
      run: |
        python -m venv .venv
        .venv/bin/pip install --upgrade pip -q
        # Install from the lock (issue #17): the component register needs a reproducible venv.
        python -m pip install -q uv==0.13.7
        python -m uv export --frozen --extra dev --no-emit-project -q -o .venv/requirements.lock.txt
        .venv/bin/pip install -q --require-hashes -r .venv/requirements.lock.txt
        .venv/bin/pip install -q --no-deps -e .
