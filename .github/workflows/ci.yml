name: CI
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    # Enforce Conventional Commits so semantic-release can derive versions +
    # changelog. PR commits only (base..head); config in commitlint.config.js.
    if: github.event_name == 'pull_request'
    runs-on: homelab
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - name: commitlint (PR commits)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  quality:
    runs-on: homelab
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - name: ruff (blocking)
        working-directory: backend
        run: .venv/bin/python -m ruff check app tests
      - name: mypy (non-blocking baseline)
        continue-on-error: true
        working-directory: backend
        run: .venv/bin/python -m mypy
      - uses: ./.github/actions/setup-node
      - name: frontend typecheck/build (blocking)
        working-directory: frontend
        run: npm run build

  test:
    runs-on: homelab
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - name: pytest
        working-directory: backend
        run: .venv/bin/python -m pytest -q
      - uses: ./.github/actions/setup-node
      - name: vitest
        working-directory: frontend
        run: npm test

  rke2-iac:
    runs-on: homelab
    defaults:
      run:
        working-directory: deploy/rke2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q ansible-core==2.21.6 ansible-lint==26.11.0 yamllint==1.38.0
      - run: ansible-galaxy install -r requirements.yml
      - run: yamllint .
      - run: ansible-lint
      - run: ansible-playbook -i inventory/hosts.example.yml site.yml --syntax-check
      - name: Cilium HelmChartConfig (helm template + kubeconform, pinned, sha256-checked)
        run: |
          T="$RUNNER_TEMP/k8stools"; mkdir -p "$T"
          curl -sSfL -o "$T/helm.tgz" https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz
          curl -sSfL -o "$T/kc.tgz" https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          printf '%s  %s\n' \
            896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea "$T/helm.tgz" \
            9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883 "$T/kc.tgz" | sha256sum -c -
          tar xzf "$T/helm.tgz" -C "$T" --strip-components=1 linux-amd64/helm
          tar xzf "$T/kc.tgz" -C "$T" kubeconform
          PATH="$T:$PATH" ./validate-cilium.sh "$T/out"

  plugin-test:
    runs-on: homelab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: go test (styxlocation Traefik plugin)
        working-directory: traefik/plugins-local/src/github.com/styx-portal/styxlocation
        run: go test ./...

  security:
    runs-on: homelab
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - name: bandit (fail on HIGH/CRITICAL)
        working-directory: backend
        run: .venv/bin/python -m bandit -c pyproject.toml -r app -ll -ii
      - name: Trivy filesystem scan (deps + secrets, fail HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
