name: CI
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    # Enforce Conventional Commits so semantic-release can derive versions +
    # changelog. PR commits only (base..head); config in commitlint.config.js.
    if: github.event_name == 'pull_request'
    runs-on: homelab
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - name: commitlint (PR commits)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  quality:
    runs-on: homelab
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - name: ruff (blocking)
        working-directory: backend
        run: .venv/bin/python -m ruff check app tests
      - name: mypy (non-blocking baseline)
        continue-on-error: true
        working-directory: backend
        run: .venv/bin/python -m mypy
      - uses: ./.github/actions/setup-node
      - name: frontend typecheck/build (blocking)
        working-directory: frontend
        run: npm run build

  test:
    runs-on: homelab
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - name: pytest
        working-directory: backend
        run: .venv/bin/python -m pytest -q
      - uses: ./.github/actions/setup-node
      - name: vitest
        working-directory: frontend
        run: npm test

  test-postgres:
    # Same backend suite against Postgres (CNPG major). Needs Docker on the runner.
    runs-on: homelab
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: styx
          POSTGRES_PASSWORD: styx-ci
          POSTGRES_DB: styx_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U styx -d styx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - name: pytest (postgres)
        working-directory: backend
        env:
          STYX_TEST_DATABASE_URL: postgresql+asyncpg://styx:styx-ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/styx_test
        run: .venv/bin/python -m pytest -q

  plugin-test:
    runs-on: homelab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: go test (styxlocation Traefik plugin)
        working-directory: traefik/plugins-local/src/github.com/styx-portal/styxlocation
        run: go test ./...

  security:
    runs-on: homelab
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - name: bandit (fail on HIGH/CRITICAL)
        working-directory: backend
        run: .venv/bin/python -m bandit -c pyproject.toml -r app -ll -ii
      - name: Trivy filesystem scan (deps + secrets, fail HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
