# Zensical site configuration. See docs/build/releases.md for why these choices were made.

[project]
site_name = "Styx Portal"
site_description = "Self-hosted remote-desktop platform"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/brand/brand.css"]
extra_javascript = ["assets/brand/brand.js"]

# Navigation structure
nav = [
  { "Home" = "index.md" },
  { "Use" = [
    "use/index.md",
    { "Getting started" = "use/getting-started.md" },
    { "Desktops" = "use/desktops.md" },
    { "Workstations" = "use/workstations.md" },
    { "Apps and the shell" = "use/services.md" },
    { "Troubleshooting" = "use/troubleshooting.md" },
  ] },
  { "Operate" = [
    "operate/index.md",
    { "Install" = "operate/install.md" },
    { "Production" = "operate/production.md" },
    { "Kubernetes" = "operate/kubernetes.md" },
    { "Harbor (enterprise)" = "operate/harbor-enterprise.md" },
    { "GitLab mirror (enterprise)" = "operate/gitlab-mirror.md" },
    { "GitLab protected branches (enterprise)" = "operate/gitlab-protect.md" },
    { "Kubernetes enterprise" = "operate/kubernetes-enterprise.md" },
    { "Enterprise images" = "operate/enterprise-images.md" },
    { "Enroll workstations" = "operate/workstations-enroll.md" },
    { "Templates and instances" = "operate/templates-instances.md" },
    { "Proxied services" = "operate/services.md" },
    { "Users, groups and SSO" = "operate/users-groups-sso.md" },
    { "Security" = "operate/security.md" },
    { "Settings reference" = "operate/settings.md" },
    { "GPU" = "operate/gpu.md" },
    { "Streaming tuning" = "operate/streaming-tuning.md" },
    { "WebRTC and TURN" = "operate/webrtc-turn.md" },
    { "Monitoring" = "operate/monitoring.md" },
    { "Log and audit shipping (enterprise)" = "operate/logging.md" },
    { "Offsite backup" = "operate/offsite-backup.md" },
    { "DR restore test" = "operate/dr-restore-test.md" },
    { "Leader election" = "operate/leader-election.md" },
    { "SLOs" = "operate/slo.md" },
    { "Alert runbook" = "operate/alert-runbook.md" },
    { "Backup schedules" = "operate/backup-schedules.md" },
    { "Upgrade" = "operate/upgrade.md" },
    { "SQLite to PostgreSQL" = "operate/sqlite-to-postgres.md" },
    { "Enterprise: OpenBao" = "enterprise/runbooks/openbao.md" },
    { "Enterprise: DMZ HAProxy" = "enterprise/runbooks/dmz-haproxy.md" },
    { "Enterprise: Rook-Ceph" = "enterprise/runbooks/rook-ceph.md" },
    { "Enterprise: Squid egress" = "enterprise/runbooks/squid-egress.md" },
    { "Enterprise: Keycloak" = "enterprise/runbooks/keycloak.md" },
    { "Enterprise: Ceph OSD encryption" = "enterprise/runbooks/ceph-osd-encryption.md" },
    { "Enterprise: Image supply chain" = "enterprise/runbooks/image-supply-chain.md" },
  ] },
  { "Build" = [
    "build/index.md",
    { "Architecture" = "build/architecture.md" },
    { "Backend" = "build/backend.md" },
    { "Frontend" = "build/frontend.md" },
    { "Agent" = "build/agent.md" },
    { "Streaming pipeline" = "build/streaming.md" },
    { "Security model" = "build/security.md" },
    { "Testing" = "build/testing.md" },
    { "Database migrations" = "build/migrations.md" },
    { "Releases and CI/CD" = "build/releases.md" },
    { "Contributing" = "build/contributing.md" },
    { "Upstream contributions" = "build/upstream.md" },
    { "Decisions" = "decisions/index.md" },
  ] },
  { "Acknowledgements" = "acknowledgements.md" },
]

[project.theme]
language = "en"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
